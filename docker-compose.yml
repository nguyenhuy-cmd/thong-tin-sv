version: '3.8'

services:
  # 1. Service Cơ sở dữ liệu MySQL
  mysql_db:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: student_management
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password_123
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nest_network

  # 2. Service Ứng dụng NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs_api
    restart: always
    ports:
      - '6969:6969'
    environment:
      PORT: 6969
      # Lưu ý: Host DB khi chạy trong Docker là tên service 'mysql_db', không dùng 'localhost'
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_USERNAME: app_user
      DB_PASSWORD: app_password_123
      DB_NAME: student_management
    depends_on:
      - mysql_db
    networks:
      - nest_network

volumes:
  mysql_data:

networks:
  nest_network:
    driver: bridge